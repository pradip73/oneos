name: Build NovaOS ISO

# Builds the ISO on a cloud runner so no Linux environment is needed locally.
# Push to main, or trigger manually from the Actions tab. The finished ISO is
# attached to the run as a downloadable artifact.
#
# The build runs inside a Debian container rather than directly on the Ubuntu
# runner. Ubuntu ships a divergent fork of live-build with different option
# names and different defaults, and using it to build a Debian trixie image
# produces confusing failures at best and a subtly wrong image at worst.
#
# Self-hosting note: this is also valid Forgejo / Gitea Actions syntax. Moving
# to a self-hosted Forgejo instance (docs/ARCHITECTURE.md section 6.2) needs
# only the `runs-on` label changed.

on:
  push:
    branches: [main, master]
    paths:
      - 'build/**'
      - 'build.sh'
      - 'VERSION'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: debian:trixie
      # live-build creates device nodes and bind-mounts inside the chroot,
      # which an unprivileged container cannot do.
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools rsync \
            ca-certificates git curl file
          echo "live-build version:"
          dpkg-query -W -f='${Version}\n' live-build

      - name: Check out
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        run: |
          chmod +x build.sh build/auto/config
          find build/config/hooks -type f -name '*.hook.*' -exec chmod +x {} + || true
          # Already root inside the container, so no sudo.
          ./build.sh build

      - name: Show result
        run: ls -lh out/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: novaos-${{ steps.ver.outputs.version }}-amd64-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 30
          compression-level: 0   # the ISO is already squashfs-compressed

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/build.log
            build/.build/
          retention-days: 7
          if-no-files-found: ignore
