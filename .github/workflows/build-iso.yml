name: Build OneOS ISO

# Builds the ISO on a cloud runner so no Linux environment is needed locally.
# Push to main, or trigger manually from the Actions tab. The finished ISO is
# attached to the run as a downloadable artifact.
#
# The build runs inside a Debian container rather than directly on the Ubuntu
# runner. Ubuntu ships a divergent fork of live-build with different option
# names and different defaults, and using it to build a Debian trixie image
# produces confusing failures at best and a subtly wrong image at worst.
#
# Self-hosting note: this is also valid Forgejo / Gitea Actions syntax. Moving
# to a self-hosted Forgejo instance (docs/ARCHITECTURE.md section 6.2) needs
# only the `runs-on` label changed.

on:
  push:
    branches: [main, master]
    paths:
      - 'build/**'
      - 'build.sh'
      - 'packaging/**'
      - 'VERSION'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Include the experimental macOS layer (command line only)'
        type: boolean
        default: false

permissions:
  contents: write   # to publish the ISO as a release

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: debian:trixie
      # live-build creates device nodes and bind-mounts inside the chroot,
      # which an unprivileged container cannot do.
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools rsync \
            ca-certificates git curl file jq
          echo "live-build version:"
          dpkg-query -W -f='${Version}\n' live-build

      - name: Check out
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check the package lists
        # A build once failed with "Unable to locate package the" because an
        # edit broke a comment mid-sentence and its words became package names.
        # apt only complains 25 minutes in, so check the shape here: every line
        # that is not blank and not a comment must look like a package name.
        run: |
          bad=0
          for f in build/config/package-lists/*.list.chroot; do
            if offenders=$(grep -nvE '^\s*(#|$)' "$f" | grep -vE ':[a-z0-9][a-z0-9.+-]*$'); then
              echo "::error file=$f::not package names:"
              echo "$offenders" | while IFS= read -r l; do echo "::error::$f $l"; done
              bad=1
            fi
          done
          [ $bad -eq 0 ] && echo "package lists OK"
          exit $bad

      - name: Decide on the macOS layer
        # Off unless asked for. Darling installs only its command-line half on
        # trixie -- the GUI packages need libavcodec60 and this is 61 -- and a
        # command line is not what anyone wants a Mac for. It costs a download
        # on every build and disk in every image, so it is now opt-in: tick
        # the box on a manual run when there is a reason to test it.
        run: |
          if [ "${{ github.event.inputs.mac }}" = "true" ]; then
            echo "macOS layer: requested"
          else
            rm -f build/config/hooks/normal/0060-mac.hook.chroot
            echo "macOS layer: skipped (run this workflow manually with the box ticked to include it)"
          fi

      - name: Build the OneOS packages into the image
        # The same files the ISO has always carried, now also as a package
        # live-build installs from config/packages.chroot. That makes dpkg
        # the owner of every OneOS file on the installed system, which is
        # what lets the repository replace them later. When the archive key
        # is committed, the keyring package rides along and the installed
        # system trusts the repository from its first boot.
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh out/packages
          mkdir -p build/config/packages.chroot
          cp out/packages/*.deb build/config/packages.chroot/
          ls -l build/config/packages.chroot

      - name: Build ISO
        run: |
          chmod +x build.sh build/auto/config
          find build/config/hooks -type f -name '*.hook.*' -exec chmod +x {} + || true

          # Already root inside the container, so no sudo.
          set +e
          ./build.sh build
          rc=$?
          set -e
          [ $rc -eq 0 ] && exit 0

          # Re-emit the failure as workflow annotations. Job logs and artifacts
          # both require repository admin credentials to download, but
          # annotations are readable through the public check-runs API -- so
          # this is the one place the error can be diagnosed without a token.
          echo "::group::Extracted errors"
          if [ -f build/build.log ]; then
            grep -E '^E:' build/build.log | tail -n 15 | while IFS= read -r l; do
              echo "::error::$l"
            done
            # dpkg's own reasons sit above the E: lines and were being cut
            # off: file conflicts, failed maintainer scripts, unmet deps.
            grep -E 'dpkg: (error|warning)|trying to overwrite|subprocess .* returned|Depends: .* not' build/build.log \
              | sort -u | tail -n 10 | while IFS= read -r l; do
              echo "::error::DPKG $l"
            done
            echo "-- last 15 lines --"
            tail -n 15 build/build.log | while IFS= read -r l; do
              echo "::error::TAIL $l"
            done
          else
            echo "::error::build/build.log was not created; failure was before lb build"
          fi
          echo "::endgroup::"
          exit $rc

      - name: Verify what is inside the image
        # Every bug shipped so far looked identical from here: green build, ISO
        # produced, something quietly absent from it. This reads the squashfs
        # that actually ships -- including permission bits, since the worst of
        # those bugs was a file present and not executable -- before anyone
        # downloads 2.6 GB to find out by clicking.
        #
        # Reports; does not gate. This check has now failed twice for reasons
        # inside itself rather than inside the image, and an unproven verifier
        # that blocks good builds is worse than none -- it teaches people to
        # ignore it. It will gate again once it has run clean a few times.
        continue-on-error: true
        run: |
          chmod +x build/verify.sh
          set +e
          build/verify.sh build > /tmp/verify.txt 2>&1
          rc=$?
          set -e
          echo "verify exited $rc"
          cat /tmp/verify.txt
          grep -E '(FAIL|warn) ' /tmp/verify.txt | sed 's/^ *//' | while IFS= read -r l; do
            echo "::warning::$l"
          done || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::warning::verify.sh itself failed with exit $rc -- the checker is broken, not necessarily the image"
          fi

      - name: Show result
        run: ls -lh out/

      - name: Surface the build's own warnings
        # The hooks print "W: [oneos] ..." when something optional could not be
        # done -- Waydroid missing, artwork not rendered. On a successful build
        # nothing uploads the log, and job logs need repository admin rights to
        # read, so those warnings were invisible and a missing feature looked
        # like a mystery. Annotations are public API, so they are readable.
        if: always()
        run: |
          if [ -f build/build.log ]; then
            grep -E '^W: \[oneos\]' build/build.log | sort -u | while IFS= read -r l; do
              echo "::warning::$l"
            done
            grep -cE '^W: \[oneos\]' build/build.log || echo "no OneOS warnings"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: oneos-${{ steps.ver.outputs.version }}-amd64-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 30
          compression-level: 0   # the ISO is already squashfs-compressed

      - name: Publish the ISO as a release
        # An Actions artifact is a zip that needs a GitHub login, cannot be
        # resumed, and is where a 2.8 GB download over an ordinary connection
        # dies -- which is exactly what happened. Release assets are plain
        # files, need no login, and answer HTTP range requests, so a browser
        # or a download manager can carry on where it stopped. GitHub caps a
        # single asset at 2 GiB, so the image ships split, with join.txt
        # saying how to put it back in one command.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          iso=$(ls out/*.iso | head -1)
          tag="iso-${VERSION}-${GITHUB_RUN_NUMBER}"
          cd out

          # 1900 MiB keeps every part under the 2 GiB cap with room to spare.
          split -b 1900M -d "$(basename "$iso")" "oneos-${VERSION}.iso.part"
          sha256sum oneos-*.iso.part* > parts.sha256

          cat > join.txt <<EOT
          Put the ISO back together, then check it.

          Windows -- open Command Prompt in the folder with the parts:
            copy /b oneos-${VERSION}.iso.part00 + oneos-${VERSION}.iso.part01 oneos-${VERSION}-amd64.iso

          Linux or macOS:
            cat oneos-${VERSION}.iso.part* > oneos-${VERSION}-amd64.iso

          Then check it. A download that stopped early looks exactly like a
          broken image -- it just will not boot, with no explanation:
            Windows:  certutil -hashfile oneos-${VERSION}-amd64.iso SHA256
            Linux:    sha256sum -c *.sha256
          Compare the result with the .sha256 file in this release.
          EOT

          body="OneOS ${VERSION}, build ${GITHUB_RUN_NUMBER}.

          The ISO is split because GitHub caps one file at 2 GB. Download every
          part and join.txt, then follow it.

          These files need no login, and a download that stops can be resumed."

          rel=$(jq -nc --arg t "$tag" --arg n "OneOS $VERSION (build $GITHUB_RUN_NUMBER)" --arg b "$body" \
                 '{tag_name:$t,name:$n,body:$b,draft:false,prerelease:true}')
          up=$(curl -fsSL -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "$rel" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
               | jq -r '.upload_url' | sed 's/{.*}//')
          [ -n "$up" ] && [ "$up" != "null" ] || { echo "::error::could not create the release"; exit 1; }

          # sort -u, because the globs overlap: parts.sha256 matches both its
          # own name and *.sha256, and uploading one name twice is a 422 that
          # failed the build after every file was already safely uploaded.
          for f in $(ls oneos-*.iso.part* *.sha256 join.txt 2>/dev/null | sort -u); do
            [ -f "$f" ] || continue
            echo "uploading $f ($(du -h "$f" | cut -f1))"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "${up}?name=${f}" > /dev/null
          done
          echo "::notice::Download without a login: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/build.log
            build/.build/
          retention-days: 7
          if-no-files-found: ignore
