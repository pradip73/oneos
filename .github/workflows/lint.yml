name: Check the code

# WHY THIS EXISTS
# Every bug this project has shipped had the same shape: something was wrong
# in a file nobody could run, and it only showed up as silence on a user's
# screen twenty minutes of build and a 2.8 GB download later. A helper
# without its executable bit. A Power button calling a binary that was never
# installed. A sandbox that hid the display socket. None of those needed a
# VM to find -- they needed someone to read the file carefully, which is
# what these tools do in ninety seconds.
#
# In particular: a QML applet with a syntax error does not fail loudly. Plasma
# silently substitutes its own widget, and the result is "the Start menu is
# not mine" with nothing anywhere saying why. qmllint answers that here.
#
# Runs on every push. Reports as annotations, which are the one channel
# readable without a repository token.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install the checkers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            shellcheck qml6-module-qtqml qt6-declarative-dev-tools \
            desktop-file-utils git ca-certificates

      - name: Check out
        uses: actions/checkout@v4

      - name: Shell scripts
        # The helpers, the hooks, and the build scripts. Style nags are off;
        # what is wanted is the class of thing that breaks at runtime --
        # unquoted expansions that split on spaces, tests that are always
        # true, variables used before they are set.
        run: |
          rc=0
          files=$(find build/config/includes.chroot/usr/bin \
                       build/config/includes.chroot/usr/lib/oneos \
                       build/config/hooks -type f 2>/dev/null)
          files="$files build.sh build/verify.sh packaging/build-deb.sh"
          for f in $files; do
            [ -f "$f" ] || continue
            # Excluded, with the reason, so that what is left is worth
            # stopping for:
            #   SC1090/SC1091  cannot follow a sourced path that exists
            #                  only on the installed system
            #   SC2155         "declare and assign separately" -- style;
            #                  none of these assignments check a status
            #   SC2038         find|xargs without -print0; these paths are
            #                  ours and contain no newlines
            #   SC2034         unused variable -- wrong for a library whose
            #                  variables are read by whoever sources it
            out=$(shellcheck -f gcc -S warning \
                    -e SC1090,SC1091,SC2155,SC2038,SC2034 \
                    "$f" 2>&1) || rc=1
            [ -n "$out" ] && printf '%s\n' "$out" | while IFS= read -r l; do
              case "$l" in
                *": error:"*)   echo "::error::$l" ;;
                *": warning:"*) echo "::warning::$l" ;;
              esac
            done
          done
          echo "shellcheck finished (rc=$rc)"
          exit $rc

      - name: QML applets
        # A parse error here is the difference between the OneOS Start menu
        # and Plasma's, with nothing on screen to say which you are looking
        # at. qmllint cannot see missing Plasma imports (they are not
        # installed in this container) so those are filtered out; a syntax
        # error is a syntax error regardless.
        run: |
          # Debian installs the Qt 6 tools outside PATH. Find it, and stop if
          # it is absent rather than reporting "tool not found" once per file
          # as though every applet were broken -- which is what the first run
          # of this step did.
          QMLLINT=$(command -v qmllint6 || command -v qmllint || true)
          [ -n "$QMLLINT" ] || QMLLINT=$(ls /usr/lib/qt6/bin/qmllint 2>/dev/null || true)
          if [ -z "$QMLLINT" ]; then
            echo "::error::qmllint is not installed; the applets were NOT checked"
            exit 1
          fi
          echo "using $QMLLINT"

          # Qt warns once per invocation about a non-UTF-8 locale, which the
          # first version reported as though it were a fault in the applets.
          export LANG=C.UTF-8 LC_ALL=C.UTF-8

          rc=0
          for f in $(find build/config/includes.chroot/usr/share/plasma -name '*.qml'); do
            out=$("$QMLLINT" "$f" 2>&1) || true
            # Only qmllint's own message lines. Everything else it prints is
            # the source line and a row of carets under it -- context for a
            # human, and meaningless on their own in an annotation.
            msgs=$(printf '%s\n' "$out" | grep -E '^(Error|Warning|Info):' || true)

            # Unresolved imports and types are expected: this container has
            # no Plasma installed, so every Plasma type is unknown here.
            # A syntax error is a syntax error regardless.
            errs=$(printf '%s\n' "$msgs" | grep -E '^Error:' \
                     | grep -viE 'import|module|unresolved|was not found' || true)
            warns=$(printf '%s\n' "$msgs" | grep -E '^Warning:' \
                     | grep -viE 'import|module|unresolved|was not found' || true)

            [ -n "$errs" ] && { printf '%s\n' "$errs" | while IFS= read -r l; do
              echo "::error::QML $f: $l"; done; rc=1; }
            # Reported, not gated: a warning here is worth reading and is not
            # by itself proof the applet will fail to load.
            [ -n "$warns" ] && printf '%s\n' "$warns" | while IFS= read -r l; do
              echo "::warning::QML $f: $l"; done
          done
          echo "qmllint finished (rc=$rc)"
          exit $rc

      - name: Desktop entries
        run: |
          rc=0
          for f in $(find build/config/includes.chroot -name '*.desktop'); do
            out=$(desktop-file-validate "$f" 2>&1) || rc=1
            [ -n "$out" ] && printf '%s\n' "$out" | while IFS= read -r l; do
              echo "::warning::$l"
            done
          done
          echo "desktop entries finished (rc=$rc)"
          # Warnings only: some keys these files use are Plasma's, and
          # desktop-file-validate does not know them.
          exit 0

      - name: Every helper the applets and entries call must exist
        # The Power button called qdbus for weeks. Nothing caught it, because
        # nothing checked that the commands the UI names are actually shipped.
        run: |
          rc=0
          bin=build/config/includes.chroot/usr/bin
          # Commands named in Exec= lines and in the applets' cmd: fields.
          named=$( { grep -rhoE '^Exec=[a-z0-9-]+' build/config/includes.chroot --include='*.desktop' | cut -d= -f2
                     grep -rhoE 'cmd: "[a-z0-9-]+' build/config/includes.chroot --include='*.qml' | cut -d'"' -f2
                     grep -rhoE '(exec|run|raw)\("oneos-[a-z-]+' build/config/includes.chroot --include='*.qml' | grep -oE 'oneos-[a-z-]+'
                   } | sort -u )
          for c in $named; do
            case "$c" in
              oneos-*)
                if [ ! -f "$bin/$c" ]; then
                  echo "::error::$c is named in the interface but is not in usr/bin"
                  rc=1
                fi
                ;;
            esac
          done
          echo "referenced helpers finished (rc=$rc)"
          exit $rc
