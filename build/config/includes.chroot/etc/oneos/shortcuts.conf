# OneOS desktop shortcuts.
#
# Linux convention puts installed programs in the application menu only.
# Windows convention also puts an icon on the desktop. OneOS follows the
# Windows one by default, because a user who installs something, looks at the
# desktop and sees nothing concludes the install failed.
#
# Set to "no" to keep the desktop clear. A user can override this for
# themselves in ~/.config/oneos/shortcuts.conf.
ENABLED=yes
