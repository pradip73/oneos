# NovaOS kernel tunables.
# See docs/ARCHITECTURE.md sections 1.3 and 3.

# --- Wine / Proton requirements ---------------------------------------------
# Many Windows games and applications memory-map far more regions than the
# Linux default of 65530 allows, and fail with obscure allocation errors.
# 1048576 is the value Valve ships in SteamOS and Fedora now defaults to.
vm.max_map_count = 1048576

# Wine opens a large number of file descriptors per prefix.
fs.file-max = 2097152

# --- Desktop responsiveness --------------------------------------------------
# With zram enabled (see /etc/default/zramswap) swapping is cheap and fast, so
# we want the kernel to use it readily rather than thrashing the page cache.
# This matters on the 4 GB minimum-spec machines.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Prefer keeping interactive processes resident.
vm.vfs_cache_pressure = 50

# --- Security ----------------------------------------------------------------
# Restrict dmesg to root; it leaks kernel addresses useful for exploitation.
kernel.dmesg_restrict = 1
# Restrict ptrace to direct children only. Note: this can interfere with some
# Wine debugging workflows; the Wine prefix sandbox (Phase 4) relaxes it
# inside the sandbox namespace rather than globally.
kernel.yama.ptrace_scope = 1
# Do not allow unprivileged users to load BPF programs.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
